 "recipeIngredient": [
  "1 Brötchen",
  "1 Zwiebeln",
  "1/2 Bund Petersilie",
  "500 g Hackfleisch, gemischt",
  "1 Eier",
  "800 g Kartoffeln, mehligkochend",
  "300 g Karotten",

 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebel und Petersilie zerkleinern und in eine große Schüssel umfüllen. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Brötchen gut ausdrücken. Mit Hack, Ei, Senf, Salz, Pfeffer und Paprikapulver zur Zwiebel geben und mit den Händen kräftig verkneten. Mit nassen Händen 8 flache Frikadellen formen, ca. 1,5 cm dick."
  },
  {
   "@type": "HowToStep",
   "text": "Mixtopf ausspülen, Rühraufsatz einsetzen. Kartoffeln, Karotten, Milch und 1 Prise Salz hineingeben und garen. (Thermomix TM31: 25 Min. · 100 °C · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen die Frikadellen dünn mit Öl bepinseln und in zwei Durchgängen garen, nach 7 Min. wenden. Innen darf nichts mehr rosa sein. (Heißluftfritteuse: 180 °C · 12–14 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Butter und Muskat zum Gemüse geben und stampfen. Mit Rühraufsatz nie höher als Stufe 4. Ist es zu fest, einen Schuss Milch dazu. (Thermomix TM31: 20 Sek. · Stufe 3)"
  }
 ]
