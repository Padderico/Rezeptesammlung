   "@type": "HowToStep",
   "text": "Milch, Sahne, Salz, Muskat, Pfeffer und die Kartoffelscheiben zugeben und vorgaren. Der Linkslauf schont die Scheiben. (Thermomix TM31: 16 Min. · 90 °C · Linkslauf · Sanftrührstufe)"

  {

   "@type": "HowToStep",
   "text": "Montagabend: Ofen vorheizen. (Ofen: 200 °C · Ober-/Unterhitze)"

  {
   "@type": "HowToStep",

  },

   "@type": "HowToStep",

  },
  {
   "@type": "HowToStep",
   "text": "Gratin 5 Min. ruhen lassen, dann lässt es sich sauber schneiden."
