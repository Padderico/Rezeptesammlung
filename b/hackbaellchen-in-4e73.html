<title>Hackbällchen in Tomatensoße mit Nudeln</title>
<script type="application/ld+json">
{
 "@context": "https://schema.org/",
 "@type": "Recipe",

 "recipeYield": "4",
 "totalTime": "PT45M",
 "keywords": "Fleisch, Pasta, Thermomix, Varoma",
 "recipeIngredient": [
  "1 Brötchen",
  "1 Zwiebeln",
  "Knoblauch (1 Zehe)",
  "1/2 Bund Petersilie",
  "400 g Hackfleisch, Rind",
  "1 Eier",
  "1 TL Senf, mittelscharf",
  "Salz",
  "Pfeffer",
  "10 g Olivenöl",
  "700 g passierte Tomaten, Mutti Passata, Glasflasche",
  "1 EL Tomatenmark, Mutti, doppelt konzentriert",
  "1 TL Gemüsebrühe, salzarm",
  "1 TL Oregano, getrocknet",
  "1 TL Zucker",
  "400 g Nudeln, Penne oder Spaghetti",
  "30 g Parmesan"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebel, Knoblauch und Petersilie zerkleinern. Die Hälfte in eine Schüssel geben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Brötchen gut ausdrücken. Mit Hackfleisch, Ei, Senf, Salz und Pfeffer zur Zwiebel in der Schüssel geben, kräftig verkneten und mit nassen Händen ca. 20 walnussgroße Bällchen formen. In den Varoma-Behälter legen."
  },
  {
   "@type": "HowToStep",
   "text": "Öl zur restlichen Zwiebel in den Mixtopf geben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Passata, Tomatenmark, Wasser, Brühe, Oregano und Zucker zugeben. Varoma aufsetzen und garen. (Thermomix TM31: 20 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen die Nudeln im Topf nach Packungsangabe kochen. (Herd: sprudelnd kochend · 10–12 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Bällchen prüfen, innen nicht mehr rosa. Dann in die Soße geben und kurz ziehen lassen. (Thermomix TM31: 2 Min. · 90 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen, den Rest abschmecken. Mit Nudeln und Parmesan servieren."
  }
 ]
}
