<title>Schweinelendchen in Apfel-Rahm mit Kartoffelpüree</title>

{

 "keywords": "Fleisch, Kartoffel, Thermomix, Pfanne",
 "recipeIngredient": [
  "400 g Schweinefleisch, Filet",
  "800 g Kartoffeln, mehligkochend",
  "250 g Milch",
  "30 g Butter",
  "1 Zwiebeln",
  "2 Äpfel, säuerlich",
  "1 EL Öl",
  "150 g Rahm",
  "1 TL Gemüsebrühe, salzarm",
  "1 TL Speisestärke",
  "Muskat",
  "Salz",
  "Pfeffer"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "1000 g Wasser und ½ TL Salz in den Mixtopf geben. Kartoffeln ins Garkörbchen füllen, einhängen, Deckel und Messbecher aufsetzen und garen. Über Wasser garen sie gleichmäßig durch, in wenig Milch bleiben sie oben roh. (Thermomix TM31: 30 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Gabelprobe: Eine Gabel muss ohne Widerstand durch das größte Kartoffelstück gleiten. Sonst 5 Min. weitergaren."
  },
  {
   "@type": "HowToStep",
   "text": "Garkörbchen mit dem Spatel herausheben, Wasser abgießen. Milch in den Mixtopf geben und erwärmen. (Thermomix TM31: 2 Min. · 90 °C · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen die Medaillons im Öl von beiden Seiten anbraten und herausnehmen. (Herd: hohe Hitze · je Seite 3 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Zwiebel und Äpfel im Bratfett andünsten, mit Sahne, Wasser und Brühe ablöschen. Stärke in 2 EL kaltem Wasser glatt rühren und einrühren. Medaillons zurück in die Soße legen und gar ziehen lassen, bis sie innen nur noch zartrosa bis weiß sind. (Herd: kleine Hitze · 6–8 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Rühraufsatz einsetzen. Butter und Muskat mit den Kartoffeln in den Mixtopf geben und zu Püree rühren. Mit Rühraufsatz nie höher als Stufe 4. (Thermomix TM31: 30 Sek. · Stufe 3)"
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen, den Rest mit Salz und Pfeffer abschmecken."
  }
 ]
}
