 "recipeIngredient": [
  "700 g Rindfleisch, Gulasch, aus der Schulter oder Wade",
  "3 Zwiebeln",
  "Knoblauch (1 Zehe)",
  "200 g Karotten",
  "2 EL Tomatenmark, Mutti, doppelt konzentriert",
  "400 g Pelati, geschält, Mutti Pelati",

 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Montagabend: Zwiebeln, Knoblauch und Karotten in den Mixtopf geben, zerkleinern und nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl zugeben und dünsten. (Thermomix TM31: 5 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Fleisch, Mehl, Paprikapulver und Tomatenmark zugeben und ohne Messbecher anschwitzen. Mehr Röstaroma gibt es, wenn du das Fleisch vorher portionsweise in der Pfanne scharf anbrätst. (Thermomix TM31: 5 Min. · Varoma · Linkslauf · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Tomaten, Wasser, Brühe, Lorbeer und Majoran zugeben. Garkorb als Spritzschutz auf den Deckel stellen und schmoren. (Thermomix TM31: 60 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Timer erneut stellen und weiterschmoren, der TM31 läuft höchstens 60 Min. am Stück. (Thermomix TM31: 30 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Fleischprobe: Zerfällt ein Stück leicht? Sonst noch 10–15 Min. weiterschmoren. Lorbeer entfernen, Portion fürs Kind abnehmen, den Rest mit Salz und Pfeffer abschmecken."
  },
  {
   "@type": "HowToStep",
   "text": "Abkühlen lassen, in eine flache Dose füllen und in den Kühlschrank stellen."
  },
  {
   "@type": "HowToStep",
   "text": "Dienstagmittag: Die Hälfte im Topf unter Rühren richtig heiß werden lassen. Ist es zu dick, einen Schuss Wasser zugeben. (Herd: mittlere Hitze · 8–10 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen 500 g Spätzle in einer Pfanne mit 1 EL Butter goldgelb schwenken. (Herd: mittlere Hitze · 5–6 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Für Mittwoch: restliches Gulasch und die zweiten 500 g Spätzle in Boxen packen. Im Büro in der Mikrowelle 3–4 Min. heiß machen, zwischendurch umrühren."
  }
 ]
