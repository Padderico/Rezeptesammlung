<title>Rindergulasch mit Karotten &amp; Spätzle</title>
<script type="application/ld+json">
{
 "@context": "https://schema.org/",

 "name": "Rindergulasch mit Karotten & Spätzle",

 "recipeYield": "6",
 "totalTime": "PT175M",
 "keywords": "Fleisch, Ofen, One-Pot, Eisen, Vorkochen, Einfrieren",
 "recipeIngredient": [
  "700 g Rindfleisch, Gulasch, aus der Schulter oder Wade",
  "3 Zwiebeln",
  "Knoblauch (1 Zehe)",
  "200 g Karotten",
  "2 EL Öl",
  "2 EL Tomatenmark, Mutti, doppelt konzentriert",
  "1 EL Paprikapulver",
  "1 EL Mehl",
  "400 g Pelati, geschält, Mutti Pelati",
  "2 TL Gemüsebrühe, salzarm",
  "Lorbeerblätter (1 Blatt)",
  "1/2 TL Majoran, getrocknet",
  "Salz",
  "Pfeffer",
  "1000 g Spätzle, frisch",
  "2 EL Butter"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Freitag, 13.11.: Ofen vorheizen, Rost auf die zweite Schiene von unten. (Ofen: 160 °C · Ober-/Unterhitze)"
  },
  {
   "@type": "HowToStep",
   "text": "Zwiebeln, Knoblauch und Karotten im Mixtopf zerkleinern. Der Thermomix hilft nur beim Schneiden, gegart wird im Ofen. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl im Bräter stark erhitzen. Fleisch in 2–3 Portionen rundum kräftig anbraten und herausnehmen. Ohne herdtauglichen Bräter in der Pfanne anbraten. (Herd: hohe Hitze · je 3–4 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Zwiebeln, Knoblauch und Karotten im Bratfett andünsten. Tomatenmark, Paprikapulver und Mehl zugeben und 1 Min. mitrösten, nicht dunkel werden lassen, sonst wird der Paprika bitter. (Herd: mittlere Hitze · 4–5 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Fleisch samt Saft zurück in den Topf. Tomaten mit dem Kochlöffel zerdrücken, mit Wasser, Brühe, Lorbeer und Majoran zugeben und einmal aufkochen. (Herd: hohe Hitze · 2 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Deckel drauf und schmoren. Nach 1,5 Std. einmal umrühren: Das Fleisch soll knapp mit Soße bedeckt sein, sonst einen Schuss Wasser nachgießen. Ohne Bräter alles in eine Auflaufform geben und fest mit Alufolie verschließen. (Ofen: 2–2,5 Std. · 160 °C Ober-/Unterhitze · 2. Schiene von unten)"
  },
  {
   "@type": "HowToStep",
   "text": "Fleischprobe: Zerfällt ein Stück beim Andrücken? Sonst noch 15 Min. weiterschmoren. Lorbeer entfernen, Portion fürs Kind abnehmen, den Rest mit Salz und Pfeffer abschmecken."
  },
  {
   "@type": "HowToStep",
   "text": "Höchstens 2 Std. abkühlen lassen (im kalten Wasserbad schneller) und in 3 flache Dosen füllen: 3 Portionen für Dienstag, 2 für Mittwoch, 1 als Reserve fürs Kind. Beschriften und einfrieren."
  },
  {
   "@type": "HowToStep",
   "text": "Auftauen: Am Montag die Dose für Dienstag und am Dienstag die Dose für Mittwoch aus dem Gefrierschrank in den Kühlschrank legen, am besten morgens, spätestens am frühen Abend. Flach eingefroren ist es bis zum nächsten Mittag aufgetaut."
  },
  {
   "@type": "HowToStep",
   "text": "Dienstagmittag: die erste Dose mit einem Schuss Wasser im Topf unter Rühren richtig heiß werden lassen. Ist noch ein Eiskern drin, mit Deckel bei kleiner Hitze etwas länger. (Herd: mittlere Hitze · 8–10 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen 500 g Spätzle in einer Pfanne mit 1 EL Butter goldgelb schwenken. (Herd: mittlere Hitze · 5–6 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Mittwochmittag: zweite Dose genauso erhitzen und die restlichen Spätzle schwenken. Mittags esst ihr zu zweit, deshalb reicht die kleinere Dose."
  }
 ]
}
