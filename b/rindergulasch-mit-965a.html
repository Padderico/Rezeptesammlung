  {
   "@type": "HowToStep",
   "text": "Zwiebeln und Paprika zerkleinern, nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl zugeben und dünsten. (Thermomix TM31: 5 Min. · Varoma · Stufe 1)"

  {
   "@type": "HowToStep",

  {

  {
   "@type": "HowToStep",

  {
   "@type": "HowToStep",

   "@type": "HowToStep",
   "text": "Lorbeer entfernen, Kinderportion abnehmen, den Rest mit Salz und Pfeffer abschmecken."
  },
  {
   "@type": "HowToStep",
   "text": "Spätzle in der Pfanne mit Butter schwenken. (Herd: mittlere Hitze · 5–6 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Gurke mit Joghurt, Essig, Zucker, Salz und Pfeffer mischen."
