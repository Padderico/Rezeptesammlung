<title>Gnocchi-Hackfleisch-Auflauf mit Tomatensoße</title>
<script type="application/ld+json">
{
 "@context": "https://schema.org/",
 "@type": "Recipe",
 "name": "Gnocchi-Hackfleisch-Auflauf mit Tomatensoße",
 "author": {
  "@type": "Organization",

 },
 "inLanguage": "de",
 "url": "https://padderico.github.io/Rezeptesammlung/rezepte/gnocchi-hackfleisch-auflauf-mit-tomatensosse.html",
 "recipeYield": "3",
 "totalTime": "PT35M",
 "keywords": "Fleisch, Thermomix, Ofen, Eisen, Vorkochen",
 "recipeIngredient": [
  "1 Zwiebeln",
  "Knoblauch (1 Zehe)",
  "150 g Karotten",
  "400 g Hackfleisch, Rind",
  "1 EL Tomatenmark",
  "400 g Pelati, stückig",
  "250 g passierte Tomaten",
  "800 g Gnocchi, aus dem Kühlregal",
  "1 Mozzarella, 125 g",
  "50 g Reibkäse"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Montagabend: Zwiebel, Knoblauch und Karotten in den Mixtopf geben, zerkleinern und nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl zugeben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Hackfleisch zugeben und ohne Messbecher anbraten. (Thermomix TM31: 5 Min. · Varoma · Linkslauf · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Tomatenmark, beide Tomatensorten, Oregano und Brühe zugeben. Garkorb als Spritzschutz auf den Deckel stellen und köcheln lassen. (Thermomix TM31: 15 Min. · 100 °C · Linkslauf · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Leicht pfeffern, kaum salzen. Abkühlen lassen und in einer Dose in den Kühlschrank stellen."
  },
  {
   "@type": "HowToStep",
   "text": "Dienstag: Ofen vorheizen. (Ofen: 200 °C · Ober-/Unterhitze)"
  },
  {
   "@type": "HowToStep",
   "text": "Gnocchi roh aus der Packung mit der kalten Soße in der Form mischen. Ist die Soße sehr dick, 100 ml Wasser unterrühren, die Gnocchi garen in der Soße."
  },
  {
   "@type": "HowToStep",
   "text": "Mozzarella und Reibekäse darauf verteilen und backen, bis es blubbert und der Käse goldbraun ist. (Ofen: 25–30 Min. · mittlere Schiene)"
  },
  {
   "@type": "HowToStep",
   "text": "Kurz ruhen lassen. Kinderportion etwas abkühlen lassen."
  }
 ]
}
