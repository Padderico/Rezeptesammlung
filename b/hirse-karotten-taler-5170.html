 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Karotten, Zwiebel und Petersilie im Mixtopf zerkleinern und umfüllen. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Hirse, Wasser und Brühe in den Mixtopf geben und garen. (Thermomix TM31: 15 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Messbecher aufsetzen und die Hirse im geschlossenen Mixtopf 10 Min. quellen lassen. Sie soll das Wasser ganz aufnehmen."
  },
  {
   "@type": "HowToStep",
   "text": "Karottenmischung, Käse, Eier, Haferflocken und etwas Pfeffer zugeben und vermengen. 10 Min. ruhen lassen, dann bindet die Masse. Zu weich? 1–2 EL Haferflocken mehr. (Thermomix TM31: 20 Sek. · Linkslauf · Stufe 3)"

  {
   "@type": "HowToStep",
   "text": "Mit feuchten Händen 12 flache Taler formen. Öl in einer beschichteten Pfanne erhitzen und die Taler goldbraun braten, in 2 Portionen. (Herd: mittlere Hitze · je Seite 4 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Orangensaft, Olivenöl, Essig, Senf und Honig in einem Schraubglas kräftig schütteln. Feldsalat erst kurz vor dem Essen anmachen."
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen, für die Erwachsenen die Taler nach Geschmack leicht salzen. Mit Frühlingsquark und Feldsalat servieren."
