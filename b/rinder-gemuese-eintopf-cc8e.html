 "keywords": "Fleisch, Suppe, One-Pot, Eisen, Vorkochen, Einfrieren",
 "recipeIngredient": [
  "550 g Rindfleisch, aus der Schulter oder Wade, in 2-cm-Würfeln",
  "2 EL Öl",
  "2 Zwiebeln",
  "Knoblauch (1 Zehe)",
  "1 EL Tomatenmark, Mutti, doppelt konzentriert",
  "400 g Pelati, geschält, Mutti Pelati",
  "3 TL Gemüsebrühe, salzarm",
  "Lorbeerblätter (2 Blätter)",
  "1 TL Majoran, getrocknet",
  "300 g Karotten",
  "200 g Sellerie",
  "Lauch (1 Stange)",
  "600 g Kartoffeln, festkochend",
  "1/2 Bund Petersilie, glatt",
  "Salz",
  "Pfeffer",
  "Brot"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebeln und Knoblauch im Mixtopf zerkleinern. Der Thermomix hilft nur beim Schneiden, gekocht wird im großen Topf, weil 5 Portionen nicht in den Mixtopf passen. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl in einem großen Topf (mind. 4 l) stark erhitzen. Fleisch in 2 Portionen rundum kräftig anbraten. (Herd: hohe Hitze · je 3–4 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Zwiebeln, Knoblauch und Tomatenmark zugeben und 2 Min. mitrösten. (Herd: mittlere Hitze · 2 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Tomaten mit dem Kochlöffel zerdrücken. Mit Wasser, Brühe, Lorbeer und Majoran zugeben, aufkochen, Deckel auflegen und schmoren. (Herd: kleine Hitze · 60 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Karotten, Sellerie, Lauch und Kartoffeln zugeben, wieder aufkochen und mit Deckel leise weiterköcheln, bis Fleisch und Kartoffeln weich sind. Die Tomaten bremsen das Garen der Kartoffeln, deshalb mit der Gabel prüfen und lieber 5–10 Min. länger. Ist der Eintopf zu dick, einen Schuss Wasser nachgießen. (Herd: mittlere bis kleine Hitze · 40–45 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Lorbeer entfernen. Portion fürs Kind abnehmen, den Rest mit Salz und Pfeffer abschmecken und die Petersilie unterrühren."
  },
  {
   "@type": "HowToStep",
   "text": "Höchstens 2 Std. abkühlen lassen und aufteilen: 3 Portionen in eine Dose für Dienstag (Kühlschrank), 2 Portionen flach einfrieren."
  },
  {
   "@type": "HowToStep",
   "text": "Dienstagmittag: mit einem Schuss Wasser im Topf unter Rühren richtig heiß werden lassen. Sind die Kartoffeln noch fest, zugedeckt 10–15 Min. leise weiterköcheln. Dazu Brot. (Herd: mittlere Hitze · 8–10 Min.)"
  }
 ]
