  {
   "@type": "HowToStep",
   "text": "Zwiebel und Knoblauch zerkleinern und nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl zugeben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"

   "@type": "HowToStep",
   "text": "Wasser und Brühe in den Mixtopf geben. Hähnchenwürfel locker in den Varoma-Behälter legen (ein paar Schlitze frei lassen), Varoma aufsetzen und zum Kochen bringen. Das Hähnchen gart dabei schon vor. (Thermomix TM31: 8 Min. · Varoma · Stufe 1)"

   "@type": "HowToStep",
   "text": "Varoma kurz abnehmen und auf einen Teller stellen. Penne durch die Deckelöffnung zugeben. Brokkoli auf den Einlegeboden legen, einsetzen, Varoma wieder aufsetzen und garen. Die Zeit gilt für Penne mit 11–12 Min. Packungsangabe, sonst Packungszeit plus 1 Min. Danach eine Penne probieren: Sie muss weich sein, sonst 2 Min. · 100 °C · Linkslauf · Sanftrührstufe weiter. (Thermomix TM31: 13 Min. · Varoma · Linkslauf · Sanftrührstufe)"

   "@type": "HowToStep",
   "text": "Hähnchen prüfen: das größte Stück aufschneiden, innen ganz weiß, ohne Rosa. Sonst noch 3 Min. · Varoma · Linkslauf · Sanftrührstufe weitergaren. Varoma abnehmen."
  },
  {
   "@type": "HowToStep",
   "text": "Frischkäse, Parmesan, Zitronenschale und 1 EL Zitronensaft in den Mixtopf geben und unterrühren. Zu dick? 50 g heißes Wasser dazu. (Thermomix TM31: 1 Min. · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Hähnchen und Brokkoli mit dem Spatel unterheben. Portion fürs Kind abnehmen, den Rest mit Pfeffer und wenig Salz abschmecken."
