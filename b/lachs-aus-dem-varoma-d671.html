  {
   "@type": "HowToStep",
   "text": "Wasser und Brühe in den Mixtopf geben. Garkörbchen mit den Kartoffeln einhängen. Karotten und Brokkoli in den Varoma-Behälter, Varoma aufsetzen und garen. (Thermomix TM31: 15 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Lachs auf den Einlegeboden legen, mit Zitronenscheiben und etwas Dill belegen, leicht pfeffern. Einlegeboden einsetzen, Deckel drauf und weitergaren. (Thermomix TM31: 15 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Garprobe: Der Lachs ist durch, wenn er sich leicht zerpflücken lässt und innen nicht mehr glasig ist. Sonst 3 Min. weiter."
  },
  {
   "@type": "HowToStep",
   "text": "Varoma abnehmen und abgedeckt warm halten. Kartoffeln aus dem Garkörbchen in eine Schüssel geben. Vom Garwasser 250 g im Mixtopf lassen, den Rest abgießen."
  },
  {
   "@type": "HowToStep",
   "text": "Sahne, Stärke, Zitronensaft und den restlichen Dill zugeben und zu einer sämigen Soße kochen. (Thermomix TM31: 4 Min. · 90 °C · Stufe 3)"
  },
  {
   "@type": "HowToStep",
   "text": "Kinderportion abnehmen, dann mit Salz und Pfeffer abschmecken. Lachs mit Kartoffeln, Gemüse und Soße servieren."
