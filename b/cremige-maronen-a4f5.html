 "recipeIngredient": [
  "1 Zwiebeln",
  "20 g Butter",
  "150 g Karotten",
  "150 g Kartoffeln, festkochend",
  "1 Äpfel, säuerlich",
  "400 g Maronen, vorgekocht",
  "2 TL Gemüsebrühe, salzarm",
  "150 g Milch",
  "Muskat",
  "Pfeffer",
  "Salz",
  "Brot"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebel in den Mixtopf geben, zerkleinern und mit dem Spatel nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Butter zugeben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Karotten, Kartoffeln, Apfel, Maronen, Wasser und Brühe zugeben und weich garen. (Thermomix TM31: 25 Min. · 100 °C · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "5 Min. abkühlen lassen. Messbecher einsetzen, ein Tuch darüberlegen und pürieren, dabei langsam von Stufe 4 auf 8 erhöhen. Der Mixtopf ist mit ca. 1,5 l gut unter der Grenze. (Thermomix TM31: 1 Min. · Stufe 4–8)"
  },
  {
   "@type": "HowToStep",
   "text": "Milch zugeben und erwärmen. Ist die Suppe zu dick, 50–100 g Wasser mehr. (Thermomix TM31: 3 Min. · 90 °C · Stufe 2)"
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen. Den Rest mit Muskat, Pfeffer und wenig Salz abschmecken."
  },
  {
   "@type": "HowToStep",
   "text": "Abkühlen lassen und auf 2 Dosen verteilen: eine für Montagmittag, eine für Dienstagabend. Aufwärmen im Topf 5 Min. unter Rühren oder in der Mikrowelle, bis sie richtig heiß ist."
  }
 ]
