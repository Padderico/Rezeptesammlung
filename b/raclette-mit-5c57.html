   "text": "Wasser in den Mixtopf geben, Garkörbchen mit ca. 700 g Kartoffeln einhängen, die übrigen Kartoffeln in den Varoma-Behälter legen. Varoma aufsetzen und garen. Gabelprobe: Sie sollen weich, aber nicht zerfallen sein. (Thermomix TM31: 35 Min. · Varoma · Stufe 1)"

  {
   "@type": "HowToStep",
