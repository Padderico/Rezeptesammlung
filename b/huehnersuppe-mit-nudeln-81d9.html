 "keywords": "Fleisch, Suppe, Thermomix, One-Pot, Vorkochen",
 "recipeIngredient": [
  "350 g Pouletbrüstli",
  "1 Zwiebeln",
  "200 g Karotten",
  "100 g Sellerie",
  "Lauch (1 Stange)",
  "10 g Öl",
  "2 TL Gemüsebrühe, salzarm",
  "80 g Nudeln, Suppennudeln",
  "1/2 Bund Petersilie",
  "Salz",
  "Pfeffer"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Am Sonntag: Zwiebel zerkleinern, Öl zugeben und dünsten. (Thermomix TM31: 5 Sek. · Stufe 5, dann 3 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Wasser, Brühe, Karotten, Sellerie, Lauch und Hähnchen zugeben und garen. Der Mixtopf ist mit gut 1,8 l voll, mehr passt in den TM31 nicht. (Thermomix TM31: 20 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Hähnchen herausnehmen und aufschneiden: Es muss innen ganz weiß sein, sonst 5 Min. im Mixtopf weitergaren. Klein zupfen und zurück in den Mixtopf geben. Höchstens 2 Std. abkühlen lassen und in einer Dose in den Kühlschrank stellen."
  },
  {
   "@type": "HowToStep",
   "text": "Am Dienstag: alles aus der Dose in den Mixtopf geben und aufkochen. Die Nudeln kommen erst dazu, wenn es kocht, sonst bleiben sie hart. (Thermomix TM31: 8 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Suppennudeln durch die Deckelöffnung zugeben und garen. Eine Nudel probieren, sie muss weich sein, sonst 2 Min. weiter. (Thermomix TM31: 7 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Petersilie unterrühren. Portion fürs Kind abnehmen, den Rest mit Salz und Pfeffer abschmecken."
  }
 ]
}
