 "recipeYield": "3",
 "totalTime": "PT45M",

 "recipeIngredient": [
  "500 g Pouletbrüstli",
  "200 g Basmatireis",
  "2 Karotten",
  "1 Peperoni, rot",
  "300 g Pak Choi",
  "150 g Zuckerschoten",
  "Knoblauch (1 Zehe)",
  "Ingwer (1 1/2 cm)",
  "200 g Kokosmilch",
  "3/4 Limette",
  "2 Frühlingszwiebeln"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Wasser in den Mixtopf geben, Garkörbchen einhängen und den Reis einwiegen. Für einen Rest am nächsten Tag 250 g Reis nehmen, das Wasser bleibt bei 1000 g."
  },
  {
   "@type": "HowToStep",
   "text": "Varoma-Behälter: Hähnchen locker in einer Lage und die Karotten verteilen, ein paar Schlitze frei lassen. Wird es zu eng, die Karotten mit auf den Einlegeboden legen. Einlegeboden: Paprika und Pak-Choi-Stiele. Varoma aufsetzen und garen. (Thermomix TM31: 28 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Bei 10 Min. Restzeit Zuckerschoten und Pak-Choi-Blätter auf den Einlegeboden legen, Deckel drauf, weiterlaufen lassen."
  },
  {
   "@type": "HowToStep",
   "text": "Hähnchen prüfen: innen weiß, nichts mehr rosa, sonst noch 3–5 Min. · Varoma · Stufe 1. Reis und Varoma-Inhalt in Schüsseln umfüllen und abgedeckt warm halten."
  },
  {
   "@type": "HowToStep",
   "text": "Mixtopf leeren und ausspülen. Knoblauch (1 große oder 2 kleine Zehen) und Ingwer zerkleinern. (Thermomix TM31: 3 Sek. · Stufe 8)"
  },
  {
   "@type": "HowToStep",
   "text": "Kokosmilch, Wasser, Stärke, Honig, Sojasauce und Limettensaft zugeben und aufkochen, bis die Soße bindet. Mit einer zweiten kleinen Dose: 300 g Kokosmilch statt Kokosmilch und Wasser und nur 1,5 TL Stärke, dann wird sie cremiger. (Thermomix TM31: 5 Min. · 100 °C · Stufe 2)"
  },
  {
   "@type": "HowToStep",
   "text": "Hähnchen und Gemüse mit der Soße mischen, mit Reis und Frühlingszwiebeln servieren. Die Sojasauce in der Soße bleibt bewusst bei 1 EL, extra Sojasauce oder Chili gibt es am Tisch."
  }
 ]
