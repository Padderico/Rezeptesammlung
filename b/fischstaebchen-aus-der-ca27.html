 "recipeIngredient": [
  "450 g Fischstäbli, TK, ca. 15 Stück",
  "800 g Kartoffeln, mehligkochend",
  "250 g Milch",
  "25 g Butter",
  "Muskat",
  "Salz (1 Prise)",
  "300 g Erbsen, TK",
  "1 Zitrone"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "1000 g Wasser und ½ TL Salz in den Mixtopf geben. Kartoffeln ins Garkörbchen füllen, einhängen, Deckel und Messbecher aufsetzen und garen. Über Wasser garen sie gleichmäßig durch, in wenig Milch bleiben sie oben roh. (Thermomix TM31: 30 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Gabelprobe: Eine Gabel muss ohne Widerstand durch das größte Kartoffelstück gleiten. Sonst 5 Min. weitergaren."
  },
  {
   "@type": "HowToStep",
   "text": "Garkörbchen mit dem Spatel herausheben, Wasser abgießen. Milch in den Mixtopf geben und erwärmen. (Thermomix TM31: 2 Min. · 90 °C · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Nach ca. 15 Min. Garzeit die Fischstäbchen in einer Lage garen, nach 6 Min. wenden. So sind Fisch und Püree gleichzeitig fertig. (Heißluftfritteuse: 200 °C · 10–12 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Erbsen in einem kleinen Topf mit 3 EL Wasser garen. (Herd: mittlere Hitze · 5 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Rühraufsatz einsetzen. Butter und Muskat mit den Kartoffeln in den Mixtopf geben und zu Püree rühren. Mit Rühraufsatz nie höher als Stufe 4. (Thermomix TM31: 20 Sek. · Stufe 3)"
  },
  {
   "@type": "HowToStep",
   "text": "Mit Zitronenspalten servieren."
  }
 ]
}
