   "text": "Kartoffeln mit 3 EL Öl, Paprikapulver, Kräutern und etwas Pfeffer mischen, auf beide Bleche verteilen und vorbacken. Kartoffeln brauchen länger als das Gemüse. (Ofen: 20 Min. · Schiene 2 + 4)"
