 "recipeIngredient": [
  "500 g Pouletbrüstli",
  "1 Zwiebeln",
  "Knoblauch (1 Zehe)",
  "Ingwer (1 cm)",
  "15 g Öl",
  "1 TL Currypulver, mild",
  "200 g Karotten",
  "250 g Brokkoli",
  "400 ml Kokosmilch",
  "1 TL Gemüsebrühe, salzarm",
  "1 TL Speisestärke",
  "250 g Basmatireis",
  "1 Limette"

 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebel, Knoblauch und Ingwer zerkleinern und nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl und Currypulver zugeben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Hähnchen, Karotten, Kokosmilch, Wasser und Brühe zugeben. Brokkoli in den Varoma-Behälter legen, Varoma aufsetzen und garen. (Thermomix TM31: 15 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen den Reis im Topf nach Packungsangabe garen. (Herd: kleine Hitze · 12–15 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Hähnchen prüfen, innen nicht mehr rosa. Stärke in 2 EL Wasser verrühren, mit dem Brokkoli zugeben und binden. (Thermomix TM31: 2 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen, den Rest mit Limettensaft abschmecken. Mit Reis servieren."
  }
