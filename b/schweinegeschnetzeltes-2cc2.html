  "250 g Champignons, braun",
  "1 TL Gemüsebrühe, salzarm",
  "400 g Brokkoli",

 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebel zerkleinern und nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl zugeben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Champignons, Wasser, Brühe und Sahne zugeben. Brokkoli in den Varoma-Behälter legen, Varoma aufsetzen und garen. Mit der Sahne sind gut 500 g Flüssigkeit im Mixtopf – so viel braucht der TM31 zum Dampfgaren. (Thermomix TM31: 6 Min. · Varoma · Linkslauf · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Varoma kurz abnehmen, das Fleisch durch die Deckelöffnung zugeben, Varoma wieder aufsetzen und weitergaren. Ein Streifen muss innen ganz durch sein. (Thermomix TM31: 8 Min. · Varoma · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen die Spätzle in einer Pfanne mit Butter goldgelb schwenken. (Herd: mittlere Hitze · 5–6 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Varoma abnehmen. Stärke in 2 EL kaltem Wasser glatt rühren, mit dem Senf in den Mixtopf geben und die Soße binden. (Thermomix TM31: 2 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen. Den Rest mit Salz und Pfeffer abschmecken, Petersilie unterrühren. Mit Spätzle und Brokkoli servieren."
  }
 ]
