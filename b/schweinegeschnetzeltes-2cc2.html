 "recipeIngredient": [
  "350 g Schweinefleisch, Schnitzel oder Lende",
  "1 Zwiebeln",
  "250 g Champignons, braun",
  "400 g Brokkoli",
  "200 g Rahm",
  "1/2 Bund Petersilie",
  "500 g Spätzle, frisch"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebel zerkleinern, nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Öl zugeben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Champignons, Wasser und Brühe zugeben. Varoma mit dem Brokkoli aufsetzen und garen. (Thermomix TM31: 6 Min. · Varoma · Linkslauf · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Varoma kurz abnehmen, das Fleisch durch die Deckelöffnung zugeben, Varoma wieder aufsetzen und weitergaren. (Thermomix TM31: 8 Min. · Varoma · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen die Spätzle in einer Pfanne mit Butter goldgelb schwenken. (Herd: mittlere Hitze · 5–6 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Varoma abnehmen. Sahne und Senf in den Mixtopf geben und die Soße fertig garen. Ist sie zu dünn: 1 TL Stärke in 2 EL Wasser verrühren, zugeben und 1 Min. weitergaren. (Thermomix TM31: 3 Min. · 100 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Kinderportion abnehmen. Den Rest mit Salz und Pfeffer abschmecken, Petersilie unterrühren. Mit Spätzle und Brokkoli servieren."
  }
 ]
