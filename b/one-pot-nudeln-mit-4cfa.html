  {
   "@type": "HowToStep",
   "text": "Zwiebel und Knoblauch zerkleinern und nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"

  {
   "@type": "HowToStep",
   "text": "Öl zugeben und dünsten. (Thermomix TM31: 3 Min. · Varoma · Stufe 1)"

   "@type": "HowToStep",
   "text": "Wasser, Brühe, Nudeln und den gefrorenen Spinat in den Mixtopf geben. Lachs in 3 Stücken in den Varoma-Behälter legen, mit etwas Zitronenschale bestreuen, Varoma aufsetzen und garen. Gilt für Nudeln mit 10–11 Min. Kochzeit, sonst 1–2 Min. länger. (Thermomix TM31: 13 Min. · Varoma · Linkslauf · Sanftrührstufe)"

  {
   "@type": "HowToStep",

   "@type": "HowToStep",
   "text": "Frischkäse und 2 EL Zitronensaft in den Mixtopf geben und unterrühren. Ist es zu dick, 50 g heißes Wasser dazu. (Thermomix TM31: 1 Min. · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Lachs zerpflücken, auf Gräten prüfen und mit dem Spatel vorsichtig unterheben. Portion fürs Kind abnehmen, den Rest mit Pfeffer, Muskat und wenig Salz abschmecken."
