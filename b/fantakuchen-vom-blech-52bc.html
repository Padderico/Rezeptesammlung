 "recipeIngredient": [
  "5 Eier",
  "150 g Zucker",
  "Vanillezucker (1 Päckchen)",
  "400 g Mehl, Type 405",
  "Backpulver (1 Päckchen)",
  "150 ml Öl, oder Rapsöl",
  "250 ml Fanta, für den Teig, für den Guss",
  "250 g Puderzucker",
  "Zuckerstreusel (1 Päckchen)"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Eier, Zucker und Vanillezucker hell und schaumig schlagen. (Thermomix TM31: 5 Min. · 37 °C · Stufe 4)"
  },
  {
   "@type": "HowToStep",
   "text": "Mehl, Backpulver und Öl zugeben und kurz verrühren. (Thermomix TM31: 15 Sek. · Stufe 4)"
  },
  {
   "@type": "HowToStep",
   "text": "Fanta für den Teig zugeben und nur kurz unterrühren, damit die Kohlensäure bleibt. Einmal mit dem Spatel vom Boden lösen und den Teig sofort aufs Blech streichen. (Thermomix TM31: 5 Sek. · Linkslauf · Stufe 3)"
  },
  {
   "@type": "HowToStep",
   "text": "Backen. Stäbchenprobe: Bleibt kein Teig am Holzstäbchen hängen, ist er fertig, sonst 2–3 Min. länger. Auf dem Blech ganz auskühlen lassen. (Ofen: Ober-/Unterhitze 180 °C (Umluft 160 °C) · mittlere Schiene · 20 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Puderzucker und Fanta für den Guss in einer Schüssel glatt rühren, auf den kalten Kuchen streichen und gleich mit den Streuseln bestreuen. Fest werden lassen und in 24 Stücke schneiden."
  }
 ]
