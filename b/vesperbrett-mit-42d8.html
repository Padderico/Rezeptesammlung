  "100 g Aufschnitt, mild, z. B. Lyoner",
  "60 g Radieschen, für den Frühlingsquark",
  "3 Karotten, klein, für den Frühlingsquark",

  "Salz"

 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Frühlingsquark selbst anrühren: Radieschen, Karotte und Frühlingszwiebel grob schneiden und im Mixtopf zerkleinern. (Thermomix TM31: 4 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Quark und Frischkäse zugeben und verrühren. Portion fürs Kind abnehmen, den Rest mit Salz und Pfeffer abschmecken. (Thermomix TM31: 15 Sek. · Linkslauf · Stufe 3)"
  },
  {
   "@type": "HowToStep",
   "text": "Für das Kind die Hälfte der Karottensticks weich dämpfen: Wasser in den Mixtopf, Sticks in den Varoma-Behälter. (Thermomix TM31: 12 Min. · Varoma · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Brot in Scheiben schneiden und dünn mit Butter bestreichen."
  },
  {
   "@type": "HowToStep",
   "text": "Schinken, Aufschnitt, Frühlingsquark, Gurke, rohe Karottensticks und Apfelspalten auf einem Brett anrichten."
  },
  {
   "@type": "HowToStep",
   "text": "Fürs Kind: Brot in kleine Stücke, Schinken in feine Streifen, dazu gedämpfte Karotten, Gurkenwürfel und hauchdünne Apfelscheiben."
  }
 ]
