  {
   "@type": "HowToStep",
   "text": "Karotten in den Mixtopf geben und fein zerkleinern. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Käse, Eier, Milch und Öl zugeben und verrühren. (Thermomix TM31: 10 Sek. · Stufe 4)"
  },
  {
   "@type": "HowToStep",

  {
   "@type": "HowToStep",
   "text": "Teig auf die 12 Förmchen verteilen und backen, bis ein Holzstäbchen sauber herauskommt. (Ofen: 20–25 Min. · 180 °C Umluft · mittlere Schiene)"

  {
   "@type": "HowToStep",
