 "recipeIngredient": [
  "300 g Hackfleisch, gemischt",
  "1 TL Öl",
  "1 Zwiebeln",
  "20 g Butter",
  "Lauch (1 Stange)",
  "500 g Kartoffeln, mehligkochend",
  "100 g Karotten",
  "2 TL Gemüsebrühe, salzarm",
  "1 TL Majoran, getrocknet",
  "100 g Rahm",
  "Muskat",
  "Pfeffer",
  "Salz",
  "1/2 Bund Schnittlauch",
  "Brot"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Zwiebel zerkleinern und nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Butter und Lauch zugeben und dünsten. (Thermomix TM31: 4 Min. · Varoma · Linkslauf · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Kartoffeln, Karotten, Wasser, Brühe und Majoran zugeben und garen. (Thermomix TM31: 25 Min. · 100 °C · Stufe 1)"
  },
  {
   "@type": "HowToStep",
   "text": "Währenddessen das Hackfleisch im Öl krümelig anbraten, bis nichts Rosa mehr zu sehen ist. (Herd: mittlere bis hohe Hitze · 6–8 Min.)"
  },
  {
   "@type": "HowToStep",
   "text": "Sahne zugeben. 3 Min. abkühlen lassen, Messbecher einsetzen und pürieren, dabei langsam steigern. Wer es stückig mag: nur 10 Sek. · Stufe 5. (Thermomix TM31: 1 Min. · Stufe 4–8)"
  },
  {
   "@type": "HowToStep",
   "text": "Hackfleisch zugeben und kurz mit erwärmen. Der Mixtopf ist mit ca. 1,8 l gerade noch unter der Grenze. (Thermomix TM31: 2 Min. · 90 °C · Linkslauf · Sanftrührstufe)"
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen, den Rest mit Muskat, Pfeffer und wenig Salz abschmecken. Mit Schnittlauch und Brot servieren."
  }
 ]
