<title>Kartoffel-Karotten-Puffer vom Blech mit Frühlingsquark</title>
<script type="application/ld+json">
{
 "@context": "https://schema.org/",

 "name": "Kartoffel-Karotten-Puffer vom Blech mit Frühlingsquark",

 "recipeYield": "3",
 "totalTime": "PT45M",
 "keywords": "Vegetarisch, Ofen, Leicht, Kartoffel",
 "recipeIngredient": [
  "600 g Kartoffeln, vorwiegend festkochend",
  "150 g Karotten",
  "1 Zwiebeln, klein",
  "2 Eier",
  "30 g Mehl",
  "3 EL Öl",
  "Muskat",
  "Pfeffer",
  "Salz",
  "200 g Frühlingsquark",
  "Apfelmus, Apfelmark, nach Lust"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Ofen vorheizen. Blech mit Backpapier belegen und mit 1 EL Öl bepinseln. (Ofen: 220 °C · Ober-/Unterhitze · mittlere Schiene)"
  },
  {
   "@type": "HowToStep",
   "text": "Kartoffeln, Karotten und Zwiebel in den Mixtopf geben und fein zerkleinern, mit dem Spatel einmal nach unten schieben. (Thermomix TM31: 5 Sek. · Stufe 5)"
  },
  {
   "@type": "HowToStep",
   "text": "Die Masse ins Küchentuch geben und kräftig ausdrücken. Das ist der wichtigste Schritt, sonst werden die Puffer nicht knusprig."
  },
  {
   "@type": "HowToStep",
   "text": "In einer Schüssel mit Eiern, Mehl, Muskat und Pfeffer verrühren. Noch nicht salzen."
  },
  {
   "@type": "HowToStep",
   "text": "12 Häufchen aufs Blech setzen, ca. 5 mm flach drücken und mit dem restlichen Öl bepinseln."
  },
  {
   "@type": "HowToStep",
   "text": "Backen, nach 15 Min. wenden und weiterbacken, bis beide Seiten goldbraun sind. (Ofen: 25 Min. · 220 °C Ober-/Unterhitze)"
  },
  {
   "@type": "HowToStep",
   "text": "Portion fürs Kind abnehmen. Mit Frühlingsquark und nach Lust Apfelmark servieren, die Erwachsenen salzen am Tisch."
  }
 ]
}
