# Prüfung vor dem Livegang: Bei jeder Änderung wird die Koch-App im Testbrowser geprüft.
# Nur wenn alles grün ist, wird die Seite (GitHub Pages) veröffentlicht – sonst bleibt die letzte gute Fassung online.
# Voraussetzung (einmalig): Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testbrowser installieren
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Daten, Datenschutz und App prüfen
        env:
          CHECK_PHOTO_URLS: "1"
        run: python tools/smoke_test.py .

  veroeffentlichen:
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
